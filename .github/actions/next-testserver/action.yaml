name: 'Start Next.js Testserver'
description: 'Starter en Next.js testserver for testing formål. Må kjøre i Playwright-containeren, som har nettleserne'

inputs:
  node-version:
    description: 'Node-versjon som skal installeres. Bør være den samme som ble brukt i test-bygget'
    required: false
    default: '26.13.0'
  cache-key:
    description: 'Nøkkelen test-workspace ble lagret med. Standard er test-workspace-<sha>'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Restore test workspace
      uses: actions/cache/restore@v6
      with:
        path: .
        key: ${{ inputs.cache-key || format('test-workspace-{0}', github.sha) }}
        fail-on-cache-miss: true

    - name: 📥 Sett opp pnpm
      uses: pnpm/action-setup@v6

    - name: 📦 Sett opp Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: 'https://npm.pkg.github.com'

    - name: Start standalone server
      shell: bash
      run: |
        cp -r public .next/standalone/
        cp -r .next/static .next/standalone/.next/
        # Docker setter HOSTNAME til container-ID, og standalone-serveren ville lyttet bare på den
        HOSTNAME=0.0.0.0 PORT=1337 node .next/standalone/server.js &

    - name: Vent på at serveren er klar
      shell: bash
      run: |
        for i in $(seq 1 30); do
          if curl -s http://localhost:1337 > /dev/null 2>&1; then
            echo "Server er klar"
            exit 0
          fi
          echo "Venter på server... ($i/30)"
          sleep 2
        done
        echo "Server startet ikke innen 60 sekunder"
        exit 1
