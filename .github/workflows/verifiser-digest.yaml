name: Verifiser digest

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
        description: Docker-image og tagg som skal sjekkes
      nais-team:
        required: false
        type: string
        default: toi
        description: NAIS-teamet som autentiserer mot GAR
    outputs:
      endret:
        description: Om base-imaget har en annen digest enn sist lagrede
        value: ${{ jobs.verifiser.outputs.endret }}
      digest:
        description: Nåværende image-digest
        value: ${{ jobs.verifiser.outputs.digest }}

jobs:
  verifiser:
    name: Verifiser digest
    runs-on: ubuntu-latest
    outputs:
      endret: ${{ steps.verifiser.outputs.endret }}
      digest: ${{ steps.verifiser.outputs.digest }}
    steps:
      - name: Autentiser mot GAR
        uses: nais/login@v0
        with:
          team: ${{ inputs.nais-team }}

      - name: Hent og sammenlign digest
        id: verifiser
        env:
          IMAGE: ${{ inputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          # Sist lagrede digest ligger i nyeste artifact "baseimage-digest" (fra Lagre digest)
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=baseimage-digest&per_page=1" --jq '.artifacts[] | select(.expired | not) | .id')
          forrige_digest=""
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/baseimage-digest.zip
            forrige_digest=$(unzip -p /tmp/baseimage-digest.zip digest.txt | tr -d '[:space:]')
          fi
          echo "Forrige digest: ${forrige_digest:-ingen}"
          echo "Nåværende digest: $digest"

          if [ "$digest" = "$forrige_digest" ]; then
            echo "endret=false" >> "$GITHUB_OUTPUT"
          else
            echo "endret=true" >> "$GITHUB_OUTPUT"
          fi
