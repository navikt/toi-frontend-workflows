name: Sjekk base-image

on:
  workflow_call:
    inputs:
      deploy-workflow:
        required: true
        type: string
        description: 'Filnavnet til appens bygg-og-deploy-workflow, f.eks. workflow.yaml'
      nais-team:
        required: false
        type: string
        default: toi
        description: NAIS-teamet som autentiserer mot GAR

jobs:
  verifiser:
    name: Verifiser digest
    runs-on: ubuntu-latest
    outputs:
      endret: ${{ steps.sammenlign.outputs.endret }}
    steps:
      # Lagre digest skriver image.txt og digest.txt etter hver vellykket prod-deploy
      - name: Hent sist deployede base-image
        id: forrige
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=baseimage-digest&per_page=1" --jq '.artifacts[] | select(.expired | not) | .id')
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/baseimage.zip
            echo "image=$(unzip -p /tmp/baseimage.zip image.txt 2>/dev/null | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
            echo "digest=$(unzip -p /tmp/baseimage.zip digest.txt 2>/dev/null | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          fi

      - name: Autentiser mot GAR
        if: ${{ steps.forrige.outputs.image != '' }}
        uses: nais/login@v0
        with:
          team: ${{ inputs.nais-team }}

      - name: Sammenlign digest
        id: sammenlign
        env:
          IMAGE: ${{ steps.forrige.outputs.image }}
          FORRIGE_DIGEST: ${{ steps.forrige.outputs.digest }}
        run: |
          if [ -z "$IMAGE" ] || [ -z "$FORRIGE_DIGEST" ]; then
            echo "Fant ingen lagret base-image-digest, bygger for å få en"
            echo "endret=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" == sha256:* ]]
          echo "Base-image: $IMAGE"
          echo "Forrige digest: $FORRIGE_DIGEST"
          echo "Nåværende digest: $digest"

          if [ "$digest" = "$FORRIGE_DIGEST" ]; then
            echo "endret=false" >> "$GITHUB_OUTPUT"
          else
            echo "endret=true" >> "$GITHUB_OUTPUT"
          fi

  start-deploy:
    name: Start bygg og deploy
    needs: [verifiser]
    if: ${{ needs.verifiser.outputs.endret == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch er et av få events som GITHUB_TOKEN kan starte nye kjøringer med
      - name: Start ${{ inputs.deploy-workflow }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy-workflow }}
        run: |
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
          gh workflow run "$DEPLOY_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$default_branch"
