name: Lagre digest

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
        description: Base-imaget (uten digest) som bygget brukte
      digest:
        required: true
        type: string
        description: Base-image-digesten som ble brukt i bygget som er deployet til prod

jobs:
  lagre:
    name: Lagre digest
    runs-on: ubuntu-latest
    steps:
      - name: Skriv image og digest til fil
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          printf '%s' "$IMAGE" > image.txt
          printf '%s' "$DIGEST" > digest.txt

      # GITHUB_TOKEN kan ikke skrive repo-variabler, så digesten lagres som artifact
      - name: Last opp digest
        uses: actions/upload-artifact@v4
        with:
          name: baseimage-digest
          path: |
            image.txt
            digest.txt
          retention-days: 90
