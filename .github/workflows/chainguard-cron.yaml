name: Sjekk Chainguard-image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
        description: Docker-image og tagg som skal sjekkes
      nais-team:
        required: false
        type: string
        default: toi
        description: NAIS-teamet som autentiserer mot GAR
    outputs:
      endret:
        description: Om image-digesten er ny siden sist bekreftede bygg
        value: ${{ jobs.sjekk.outputs.endret }}
      digest:
        description: Nåværende image-digest
        value: ${{ jobs.sjekk.outputs.digest }}
      digest-variabel:
        description: Repository-variabelen som lagrer sist bekreftede digest
        value: ${{ jobs.sjekk.outputs.digest-variabel }}

jobs:
  sjekk:
    name: Sjekk Chainguard-image
    runs-on: ubuntu-latest
    outputs:
      endret: ${{ steps.sjekk.outputs.endret }}
      digest: ${{ steps.sjekk.outputs.digest }}
      digest-variabel: ${{ steps.sjekk.outputs.digest-variabel }}
    steps:
      - name: Autentiser mot GAR
        uses: nais/login@v0
        with:
          team: ${{ inputs.nais-team }}

      - name: Hent og sammenlign digest
        id: sjekk
        env:
          IMAGE: ${{ inputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub-variabler tillater bare A-Z, 0-9 og _
          DIGEST_VARIABEL="$(echo "${GITHUB_REPOSITORY#*/}" | tr 'a-z-' 'A-Z_')_DIGEST"
          echo "digest-variabel=$DIGEST_VARIABEL" >> "$GITHUB_OUTPUT"

          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
          forrige_digest=$(gh variable get "$DIGEST_VARIABEL" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)

          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [ "$digest" = "$forrige_digest" ]; then
            echo "endret=false" >> "$GITHUB_OUTPUT"
          else
            echo "endret=true" >> "$GITHUB_OUTPUT"
          fi
