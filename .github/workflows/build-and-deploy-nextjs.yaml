on:
  workflow_call:
    inputs:
      deploy-to-dev-only:
        required: false
        type: boolean
        default: false
      deploy-dev-branch:
        required: false
        type: string
      deploy-dev2-branch:
        required: false
        type: string
      dev-vars-path:
        required: false
        type: string
        description: 'Path to VARS file for NAIS deployment'
        default: ''
      dev2-vars-path:
        required: false
        type: string
        description: 'Path to VARS file for NAIS deployment'
        default: ''
      prod-vars-path:
        required: false
        type: string
        description: 'Path to VARS file for NAIS deployment'
        default: ''
      dev-yaml-path:
        required: false
        type: string
        description: 'Path to YAML file for NAIS deployment'
        default: '.nais/app.yaml'
      dev2-yaml-path:
        required: false
        type: string
        description: 'Path to YAML file for NAIS deployment'
        default: '.nais/app.yaml'
      prod-yaml-path:
        required: false
        type: string
        description: 'Path to YAML file for NAIS deployment'
        default: '.nais/app.yaml'
      nais-alerts-path:
        required: false
        type: string
        description: 'Path to nais alert file'
        default: '.nais/alerts.yaml'
      nais-team:
        required: false
        type: string
        default: 'toi'
        description: 'NAIS-team som image bygges for'
      node-version:
        required: false
        type: string
        default: '26.13.0'
        description: 'Node-versjon for bygg, testserver og Playwright-rapport i CI. Påvirker ikke Node-versjonen i Docker-imaget'
      playwright-command:
        required: false
        type: string
        default: ''
        description: 'Kommando for å kjøre Playwright-tester, f.eks. pnpm run test (ikke pnpm test: pnpm 12 tolker --reporter selv)'
      playwright-github-report:
        required: false
        type: boolean
        default: false
      playwright-snapshots:
        required: false
        type: boolean
        default: false
        description: 'Oppdater og commit Playwright snapshots automatisk i PR'
      playwright-shards:
        required: false
        type: number
        default: 1
        description: 'Antall parallelle shards for Playwright-tester'
      a11y-command:
        required: false
        type: string
        default: ''
        description: 'Kommando for tilgjengelighetstester (axe i Playwright), f.eks. pnpm run test:a11y. Kjøres i egen jobb som ikke stopper deploy'
      baseimage:
        required: false
        type: string
        default: ''
        description: 'Base-image for Dockerfile (ARG BASEIMAGE). Bygget låses til nåværende digest, som lagres etter prod-deploy for sjekk-base-image.yaml'
      cdn-upload:
        required: false
        type: boolean
        default: false
        description: 'Last opp .next/static til cdn.nav.no og sett CDN_ASSET_PREFIX ved bygg (gir lesbare stacktracer i Nais APM). Krever at repoet er autorisert i Nais console og at next.config bruker process.env.CDN_ASSET_PREFIX som assetPrefix'
jobs:
  build:
    name: 🏗️ Bygg applikasjon
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v7

      - name: 📥 Sett opp pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Sett opp Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'

      - name: 📥 Installer Avhengigheter
        uses: navikt/toi-frontend-workflows/.github/actions/install-pnpm-dependencies@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: ☁️ Sett CDN asset prefix
        if: ${{ inputs.cdn-upload }}
        env:
          TEAM: ${{ inputs.nais-team }}
          APP: ${{ github.event.repository.name }}
        run: echo "CDN_ASSET_PREFIX=https://cdn.nav.no/$TEAM/$APP" >> "$GITHUB_ENV"

      - name: 🛠️ Bygg Next applikasjon
        uses: navikt/toi-frontend-workflows/.github/actions/build-next-pnpm@v4

      - name: ☁️ Last opp statiske filer til CDN
        if: ${{ inputs.cdn-upload }}
        uses: nais/deploy/actions/cdn-upload/v2@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # master
        with:
          team: ${{ inputs.nais-team }}
          source: .next/static
          destination: /${{ github.event.repository.name }}/_next

      - name: Cache workspace
        uses: actions/cache/save@v6
        with:
          path: .
          key: workspace-${{ github.sha }}

      - name: � Autentiser mot GAR
        if: ${{ inputs.baseimage != '' }}
        uses: nais/login@v0
        with:
          team: ${{ inputs.nais-team }}

      - name: 📌 Lås base-image til digest
        id: baseimage
        if: ${{ inputs.baseimage != '' }}
        env:
          IMAGE: ${{ inputs.baseimage }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: 🐳 Last opp Docker-image til GAR
        id: docker-build-push
        uses: nais/docker-build-push@v0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        with:
          team: ${{ inputs.nais-team }}
          build_args: ${{ inputs.baseimage != '' && format('BASEIMAGE={0}@{1}', inputs.baseimage, steps.baseimage.outputs.digest) || '' }}
          build_secrets: 'NODE_AUTH_TOKEN=${{ secrets.READER_TOKEN }}'
          tag: ${{ contains(fromJSON('["refs/heads/master", "refs/heads/main"]'), github.ref) && 'latest' || github.sha }}
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      baseimage-digest: ${{ steps.baseimage.outputs.digest }}

  test-build:
    name: 🧪 Bygg for testing
    if: ${{ inputs.playwright-command != '' || inputs.a11y-command != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v7

      - name: 📥 Sett opp pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Sett opp Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'

      - name: 📥 Installer Avhengigheter
        uses: navikt/toi-frontend-workflows/.github/actions/install-pnpm-dependencies@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      # Playwright-imaget må ha nøyaktig samme versjon som appen har låst
      - name: 🎭 Finn Playwright-versjon
        id: playwright
        shell: bash
        run: |
          versjon=$(node -p "require('@playwright/test/package.json').version")
          if [[ ! "$versjon" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Fant ikke stabil versjon av @playwright/test i appen (fikk '$versjon'). Prerelease-versjoner støttes ikke"
            exit 1
          fi
          # Imagene har zstd fra 1.64.0. Uten zstd finner ikke cache-restore workspace lagret på hosten
          minste=1.64.0
          if [[ "$(printf '%s\n' "$minste" "$versjon" | sort -V | head -n1)" != "$minste" ]]; then
            echo "::error::@playwright/test $versjon er for gammel. Testene kjører i Playwright-imaget, som krever minst $minste"
            exit 1
          fi
          echo "Playwright $versjon"
          echo "versjon=$versjon" >> "$GITHUB_OUTPUT"

      - name: 🛠️ Bygg for test
        shell: bash
        run: pnpm test-build

      - name: Cache test workspace
        uses: actions/cache/save@v6
        with:
          path: .
          # Unik per kjøring, slik at testjobbene alltid får workspace fra denne test-builden
          key: test-workspace-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Samme main-revisjon brukes som snapshot-baseline i alle shards og i commit-jobben
      - name: 📸 Finn snapshot-baseline
        id: snapshot-baseline
        if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Fant ikke main i repoet (fikk '$sha')"
            exit 1
          fi
          echo "Snapshot-baseline: main@$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 🔢 Beregn Playwright-shards
        id: shards
        shell: bash
        run: echo "shards=$(seq 1 ${{ inputs.playwright-shards }} | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      playwright-version: ${{ steps.playwright.outputs.versjon }}
      cache-key: test-workspace-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      snapshot-baseline-sha: ${{ steps.snapshot-baseline.outputs.sha }}

  deploy-til-dev:
    name: 🚀 Deploy til dev
    needs: [build, test-build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == format('refs/heads/{0}', inputs.deploy-dev-branch) || contains(fromJSON('["refs/heads/master", "refs/heads/main"]'), github.ref)) }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v7

      - name: 📦 Deploy til Dev
        uses: nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: ${{ inputs.dev-yaml-path }}
          VAR: image=${{ needs.build.outputs.image }}
          VARS: ${{ inputs.dev-vars-path }}

  deploy-til-dev2:
    name: 🚀 Deploy til dev2
    needs: [build, test-build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == format('refs/heads/{0}', inputs.deploy-dev2-branch) || contains(fromJSON('["refs/heads/master", "refs/heads/main"]'), github.ref)) }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v7

      - name: 📂 Sjekk om dev2-konfigurasjon finnes
        id: check-dev2-file
        env:
          DEV2_VARS_PATH: ${{ inputs.dev2-vars-path || '.nais/dev2-gcp.json' }}
        run: |
          if [ -f "$DEV2_VARS_PATH" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Deploy til dev2
        if: steps.check-dev2-file.outputs.exists == 'true'
        uses: nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: ${{ inputs.dev2-yaml-path }}
          VAR: image=${{ needs.build.outputs.image }}
          VARS: ${{ inputs.dev2-vars-path }}

  playwright-tests:
    name: 🎭 Playwright Tests
    if: ${{ inputs.playwright-command != '' }}
    needs: [test-build]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.test-build.outputs.playwright-version }}-noble
      # Chromium trenger mer delt minne enn Dockers standard
      options: --shm-size=1gb
    env:
      # Workspace er test-build sin verifiserte installasjon. Uten dette reinstallerer pnpm fordi stien er ny i containeren,
      # og supply-chain-sjekken feiler mot GitHub Packages uten token
      pnpm_config_verify_deps_before_run: 'false'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.test-build.outputs.shards) }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: 🚀 Start testserver
        uses: navikt/toi-frontend-workflows/.github/actions/next-testserver@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache-key: ${{ needs.test-build.outputs.cache-key }}

      - name: 🔄 Hent snapshot-baseline fra main
        if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test-build.outputs.snapshot-baseline-sha }}
          path: .main-baseline

      - name: 📸 Synk snapshot-baseline mot main
        id: snapshot-sync
        if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          if [ -d .main-baseline/tests ]; then
            find .main-baseline/tests -path '*-snapshots/*.png' -type f | while read -r f; do
              rel="${f#.main-baseline/}"
              mkdir -p "$(dirname "$rel")"
              cp "$f" "$rel"
            done
          fi
          rm -rf .main-baseline
          # Hver shard skal bare sende bilder den selv har endret, ellers overskriver shardene hverandre.
          # Commit-jobben synker samme baseline, så uendrede baseline-bilder trenger ikke sendes
          : > /tmp/snapshots-for.txt
          if [ -d tests ]; then
            find tests -path '*-snapshots/*.png' -type f -exec sha256sum {} + | sort > /tmp/snapshots-for.txt
          fi

      - name: 🎭 Playwright
        shell: bash
        run: ${{ inputs.playwright-command }}${{ inputs.playwright-shards > 1 && format(' --shard={0}/{1}', matrix.shard, inputs.playwright-shards) || '' }}${{ inputs.playwright-github-report && ' --reporter=blob,list' || '' }}${{ inputs.playwright-snapshots && ' --update-snapshots' || '' }}
        env:
          # Firefox krever at HOME eies av brukeren, og containeren kjører som root
          HOME: /root

      - name: 📸 Lagre snapshots midlertidig
        id: snapshot-save
        if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' && !cancelled() && steps.snapshot-sync.outcome == 'success' }}
        shell: bash
        run: |
          : > /tmp/snapshots-etter.txt
          if [ -d tests ]; then
            find tests -path '*-snapshots/*.png' -type f -exec sha256sum {} + | sort > /tmp/snapshots-etter.txt
          fi
          # Nye eller endrede bilder. sha256sum skriver «<hash>  <sti>»
          comm -13 /tmp/snapshots-for.txt /tmp/snapshots-etter.txt | cut -d' ' -f3- > /tmp/snapshot-files.txt
          echo "Found $(wc -l < /tmp/snapshot-files.txt) changed snapshot files:"
          cat /tmp/snapshot-files.txt
          # Lages også uten endringer, slik at et omkjørt shard erstatter resultatet fra forrige forsøk
          tar cf /tmp/snapshots.tar -T /tmp/snapshot-files.txt

      # Publiseres alltid, også når baseline-synk eller lagring feilet, slik at commit-jobben ikke bruker et eldre forsøk
      - name: 📸 Skriv snapshot-resultat
        if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' && !cancelled() }}
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          ATTEMPT: ${{ github.run_attempt }}
          BASELINE: ${{ needs.test-build.outputs.snapshot-baseline-sha }}
          CACHE_KEY: ${{ needs.test-build.outputs.cache-key }}
          LAGRET: ${{ steps.snapshot-save.outcome }}
        run: |
          rm -rf /tmp/snapshot-resultat
          mkdir -p /tmp/snapshot-resultat
          status=ugyldig
          if [ "$LAGRET" = success ] && [ -f /tmp/snapshots.tar ]; then
            status=ok
            mv /tmp/snapshots.tar /tmp/snapshot-resultat/snapshots.tar
          fi
          printf 'status=%s\nshard=%s\nattempt=%s\nbaseline=%s\ncache-key=%s\n' \
            "$status" "$SHARD" "$ATTEMPT" "$BASELINE" "$CACHE_KEY" > /tmp/snapshot-resultat/resultat.txt
          cat /tmp/snapshot-resultat/resultat.txt

      - name: ⬆️ Last opp snapshot-endringer
        if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # Unikt per forsøk. download-artifact velger ellers nyeste artefakt per navn, også fra tidligere forsøk
          name: snapshot-changes-${{ matrix.shard }}-${{ github.run_attempt }}
          path: /tmp/snapshot-resultat/
          if-no-files-found: error
          retention-days: 1

      - name: ⬆️ Last opp blob-report
        if: ${{ inputs.playwright-github-report && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  playwright-commit-snapshots:
    name: 📸 Commit Playwright-snapshots
    needs: [test-build, playwright-tests]
    if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' && !cancelled() && needs.playwright-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔄 Hent kildekode
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: 🔄 Hent snapshot-baseline fra main
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.test-build.outputs.snapshot-baseline-sha }}
          path: .main-baseline

      - name: 📸 Synk snapshot-baseline mot main
        shell: bash
        run: |
          if [ -d .main-baseline/tests ]; then
            find .main-baseline/tests -path '*-snapshots/*.png' -type f | while read -r f; do
              rel="${f#.main-baseline/}"
              mkdir -p "$(dirname "$rel")"
              cp "$f" "$rel"
            done
          fi
          rm -rf .main-baseline

      - name: ⬇️ Last ned snapshot-endringer fra alle shards
        uses: actions/download-artifact@v8
        with:
          pattern: snapshot-changes-*
          path: /tmp/snapshot-artifacts

      # Bruker bare nyeste forsøk per shard. Er det ugyldig eller fra en annen baseline/test-build, hoppes sharden over
      - name: 📸 Gjenopprett snapshots
        shell: bash
        env:
          BASELINE: ${{ needs.test-build.outputs.snapshot-baseline-sha }}
          CACHE_KEY: ${{ needs.test-build.outputs.cache-key }}
        run: |
          shopt -s nullglob
          verdi() { sed -n "s/^$1=//p" "$2" | head -n1; }
          : > /tmp/snapshot-forsok.txt
          for d in /tmp/snapshot-artifacts/snapshot-changes-*/; do
            meta="${d}resultat.txt"
            if [ ! -f "$meta" ]; then
              echo "::warning::Mangler resultat.txt i $d"
              continue
            fi
            shard=$(verdi shard "$meta")
            attempt=$(verdi attempt "$meta")
            if [[ ! "$shard" =~ ^[0-9]+$ || ! "$attempt" =~ ^[0-9]+$ ]]; then
              echo "::warning::Ugyldig shard/forsøk i $meta"
              continue
            fi
            echo "$shard $attempt $d" >> /tmp/snapshot-forsok.txt
          done
          sort -k1,1n -k2,2nr /tmp/snapshot-forsok.txt | awk '!sett[$1]++' | while read -r shard attempt d; do
            meta="${d}resultat.txt"
            if [ "$(verdi status "$meta")" != ok ]; then
              echo "::warning::Shard $shard (forsøk $attempt) har ikke gyldige snapshots. Hopper over"
            elif [ "$(verdi baseline "$meta")" != "$BASELINE" ] || [ "$(verdi cache-key "$meta")" != "$CACHE_KEY" ]; then
              echo "::warning::Shard $shard (forsøk $attempt) er fra en annen baseline eller test-build. Hopper over"
            else
              echo "Gjenoppretter shard $shard fra forsøk $attempt"
              tar xf "${d}snapshots.tar"
            fi
          done
          find tests -path '*-snapshots/*.png' -type f | head -10 || true

      - name: 📸 Commit oppdaterte snapshots
        shell: bash
        run: |
          shopt -s globstar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/**/*-snapshots/**/*.png

          for file in $(git diff --cached --name-only -- '*.png'); do
            if git cat-file -e HEAD:"$file" 2>/dev/null; then
              git show HEAD:"$file" > /tmp/old_snapshot.png
              PIXELS=$(compare -metric AE /tmp/old_snapshot.png "$file" null: 2>&1 || true)
              if [ "$PIXELS" = "0" ]; then
                echo "Ingen visuell endring: $file"
                git checkout HEAD -- "$file"
              fi
            fi
          done

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "oppdater playwright snapshots"
            git push
          fi

  playwright-report:
    name: 📊 Playwright Report
    needs: [playwright-tests]
    if: ${{ contains(fromJSON('["refs/heads/main"]'), github.ref) && !cancelled() && inputs.playwright-github-report == true && needs.playwright-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v7

      - name: 📥 Sett opp pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Sett opp Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'

      - name: 📥 Installer Avhengigheter
        uses: navikt/toi-frontend-workflows/.github/actions/install-pnpm-dependencies@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: ⬇️ Last ned blob-reports fra alle shards
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: 🔀 Slå sammen rapporter
        shell: bash
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy Playwright Report to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: playwright-report
          clean: true
          single-commit: true
          target-folder: playwright-report
          token: ${{ secrets.GITHUB_TOKEN }}

  a11y-tests:
    name: ♿ Tilgjengelighet
    needs: [build, test-build]
    if: ${{ !cancelled() && inputs.a11y-command != '' && needs.test-build.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.test-build.outputs.playwright-version }}-noble
      # Chromium trenger mer delt minne enn Dockers standard
      options: --shm-size=1gb
    env:
      # Workspace er test-build sin verifiserte installasjon. Uten dette reinstallerer pnpm fordi stien er ny i containeren,
      # og supply-chain-sjekken feiler mot GitHub Packages uten token
      pnpm_config_verify_deps_before_run: 'false'
    timeout-minutes: 30
    steps:
      - name: 🚀 Start testserver
        uses: navikt/toi-frontend-workflows/.github/actions/next-testserver@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache-key: ${{ needs.test-build.outputs.cache-key }}

      - name: ♿ Tilgjengelighetstester (WCAG 2.1 A/AA)
        shell: bash
        run: ${{ inputs.a11y-command }}
        env:
          # Firefox krever at HOME eies av brukeren, og containeren kjører som root
          HOME: /root

      - name: ⬆️ Last opp tilgjengelighetsrapport
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: tilgjengelighetsrapport
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  deploy-til-prod:
    name: 🚀 Deploy til produksjon
    needs:
      - build
      - playwright-tests
    if: ${{ always() && !inputs.deploy-to-dev-only && contains(fromJSON('["refs/heads/master", "refs/heads/main"]'), github.ref) && needs.build.result == 'success' && (inputs.playwright-command == '' || needs.playwright-tests.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v7

      - name: 📦 Deploy til Prod
        uses: nais/deploy/actions/deploy@v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: ${{ inputs.prod-yaml-path }}${{ inputs.nais-alerts-path != '' && format(',{0}', inputs.nais-alerts-path) || '' }}
          VAR: image=${{ needs.build.outputs.image }}
          VARS: ${{ inputs.prod-vars-path }}

      - name: 📝 Deployment Oppsummering
        if: success()
        uses: navikt/toi-frontend-workflows/.github/actions/deployment-success-summary@v4
        with:
          image: ${{ needs.build.outputs.image }}
          branch: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          environment: Produksjon

      - name: ⚠️ Deployment Feilet
        if: failure()
        uses: navikt/toi-frontend-workflows/.github/actions/deployment-failure-summary@v4
        with:
          image: ${{ needs.build.outputs.image }}
          branch: ${{ github.ref_name }}
          environment: Produksjon

  lagre-digest:
    name: 💾 Base-image
    needs: [build, deploy-til-prod]
    # !cancelled() trengs: implisitt success() er usann når test-build/playwright-tests er hoppet over (apper uten tester)
    if: ${{ !cancelled() && needs.deploy-til-prod.result == 'success' && needs.build.outputs.baseimage-digest != '' }}
    uses: navikt/toi-frontend-workflows/.github/workflows/lagre-digest.yaml@v4
    with:
      image: ${{ inputs.baseimage }}
      digest: ${{ needs.build.outputs.baseimage-digest }}
