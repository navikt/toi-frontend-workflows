on:
  workflow_call:
    inputs:
      deploy-to-dev-only:
        required: false
        type: boolean
        default: false
      deploy-dev-branch:
        required: false
        type: string
      deploy-dev2-branch:
        required: false
        type: string
      dev-vars-path:
        required: false
        type: string
        description: 'Path to VARS file for NAIS deployment'
        default: ''
      dev2-vars-path:
        required: false
        type: string
        description: 'Path to VARS file for NAIS deployment'
        default: ''
      prod-vars-path:
        required: false
        type: string
        description: 'Path to VARS file for NAIS deployment'
        default: ''
      dev-yaml-path:
        required: false
        type: string
        description: 'Path to YAML file for NAIS deployment'
        default: '.nais/app.yaml'
      dev2-yaml-path:
        required: false
        type: string
        description: 'Path to YAML file for NAIS deployment'
        default: '.nais/app.yaml'
      prod-yaml-path:
        required: false
        type: string
        description: 'Path to YAML file for NAIS deployment'
        default: '.nais/app.yaml'
      nais-alerts-path:
        required: false
        type: string
        description: 'Path to nais alert file'
        default: '.nais/alerts.yaml'
      nais-team:
        required: false
        type: string
        default: 'toi'
        description: 'NAIS-team som image bygges for'
      node-version:
        required: false
        type: string
        default: '22.20.0'
      playwright-command:
        required: false
        type: string
        default: ''
        description: 'Kommando for å kjøre Playwright-tester, f.eks. pnpm run test (ikke pnpm test: pnpm 12 tolker --reporter selv)'
      playwright-github-report:
        required: false
        type: boolean
        default: false
      playwright-snapshots:
        required: false
        type: boolean
        default: false
        description: 'Oppdater og commit Playwright snapshots automatisk i PR'
      playwright-shards:
        required: false
        type: number
        default: 1
        description: 'Antall parallelle shards for Playwright-tester'
      storybook:
        required: false
        type: boolean
        default: false
      storybook-base-path:
        required: false
        type: string
        default: ''
        description: 'Base path for Storybook (f.eks. /min-app/storybook/)'
      a11y-command:
        required: false
        type: string
        default: ''
        description: 'Kommando for å kjøre a11y-tester, f.eks. pnpm pa11y-ci'
      baseimage:
        required: false
        type: string
        default: ''
        description: 'Base-image for Dockerfile (ARG BASEIMAGE). Sjekkes for ny digest ved schedule eller workflow_dispatch med kjor-chainguard-sjekk; tom = ingen sjekk'
jobs:
  verifiser-digest:
    name: 🔍 Base-image
    # kjor-chainguard-sjekk er et workflow_dispatch-valg i appens egen workflow
    if: ${{ inputs.baseimage != '' && (github.event_name == 'schedule' || github.event.inputs.kjor-chainguard-sjekk == 'true') }}
    uses: navikt/toi-frontend-workflows/.github/workflows/verifiser-digest.yaml@v3.1
    with:
      image: ${{ inputs.baseimage }}
      nais-team: ${{ inputs.nais-team }}

  build:
    name: 🏗️ Bygg applikasjon
    needs: [verifiser-digest]
    if: ${{ !cancelled() && ((github.event_name != 'schedule' && github.event.inputs.kjor-chainguard-sjekk != 'true') || inputs.baseimage == '' || needs.verifiser-digest.outputs.endret == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v5

      - name: 📥 Sett opp pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Sett opp Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'

      - name: 📥 Installer Avhengigheter
        uses: navikt/toi-frontend-workflows/.github/actions/install-pnpm-dependencies@v2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: 🛠️ Bygg Next applikasjon
        uses: navikt/toi-frontend-workflows/.github/actions/build-next-pnpm@v2

      - name: Cache workspace
        uses: actions/cache/save@v6
        with:
          path: .
          key: workspace-${{ github.sha }}

      - name: � Autentiser mot GAR
        if: ${{ inputs.baseimage != '' }}
        uses: nais/login@v0
        with:
          team: ${{ inputs.nais-team }}

      - name: 📌 Lås base-image til digest
        id: baseimage
        if: ${{ inputs.baseimage != '' }}
        env:
          IMAGE: ${{ inputs.baseimage }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -r '.digest')
          [[ "$digest" == sha256:* ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: 🐳 Last opp Docker-image til GAR
        id: docker-build-push
        uses: nais/docker-build-push@v0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        with:
          team: ${{ inputs.nais-team }}
          build_args: ${{ inputs.baseimage != '' && format('BASEIMAGE={0}@{1}', inputs.baseimage, steps.baseimage.outputs.digest) || '' }}
          build_secrets: 'NODE_AUTH_TOKEN=${{ secrets.READER_TOKEN }}'
          tag: ${{ contains(fromJSON('["refs/heads/master", "refs/heads/main"]'), github.ref) && 'latest' || github.sha }}
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      baseimage-digest: ${{ steps.baseimage.outputs.digest }}

  test-build:
    name: 🧪 Bygg for testing
    needs: [verifiser-digest]
    if: ${{ !cancelled() && (inputs.playwright-command != '' || inputs.a11y-command != '') && ((github.event_name != 'schedule' && github.event.inputs.kjor-chainguard-sjekk != 'true') || inputs.baseimage == '' || needs.verifiser-digest.outputs.endret == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v5

      - name: 📥 Sett opp pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Sett opp Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'

      - name: 📥 Installer Avhengigheter
        uses: navikt/toi-frontend-workflows/.github/actions/install-pnpm-dependencies@v2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: 🛠️ Bygg for test
        shell: bash
        run: pnpm test-build

      - name: Cache test workspace
        uses: actions/cache/save@v6
        with:
          path: .
          key: test-workspace-${{ github.sha }}

      - name: 🔢 Beregn Playwright-shards
        id: shards
        shell: bash
        run: echo "shards=$(seq 1 ${{ inputs.playwright-shards }} | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
    outputs:
      shards: ${{ steps.shards.outputs.shards }}

  call-trivy-security-scan:
    name: 🔒 Security Scan
    needs: [build, test-build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      security-events: write
    steps:
      - name: Kjør Trivy scan
        uses: navikt/toi-github-actions-workflows/.github/actions/trivy-scan@v12
        with:
          image: ${{ needs.build.outputs.image }}

  deploy-til-dev:
    name: 🚀 Deploy til dev
    needs: [build, test-build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.ref == format('refs/heads/{0}', inputs.deploy-dev-branch) || (inputs.deploy-to-dev-only && contains(fromJSON('["refs/heads/master", "refs/heads/main"]'), github.ref))) }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v5

      - name: 📦 Deploy til Dev
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: ${{ inputs.dev-yaml-path }}
          VAR: image=${{ needs.build.outputs.image }}
          VARS: ${{ inputs.dev-vars-path }}

  deploy-til-dev2:
    name: 🚀 Deploy til dev2
    needs: [build, test-build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == format('refs/heads/{0}', inputs.deploy-dev2-branch) }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v5

      - name: 📂 Sjekk om dev2-gcp.json finnes
        id: check-dev2-file
        run: |
          if [ -f ".nais/dev2-gcp.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Deploy til dev2
        if: steps.check-dev2-file.outputs.exists == 'true'
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: ${{ inputs.dev2-yaml-path }}
          VAR: image=${{ needs.build.outputs.image }}
          VARS: ${{ inputs.dev2-vars-path }}

  playwright-tests:
    name: 🎭 Playwright Tests
    if: ${{ !cancelled() && inputs.playwright-command != '' && needs.test-build.result == 'success' }}
    needs: [test-build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.test-build.outputs.shards) }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: 🚀 Start testserver
        uses: navikt/toi-frontend-workflows/.github/actions/next-testserver@v2

      - name: 🔄 Hent snapshot-baseline fra main
        if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' }}
        uses: actions/checkout@v5
        with:
          ref: main
          path: .main-baseline

      - name: 📸 Synk snapshot-baseline mot main
        if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          if [ -d .main-baseline/tests ]; then
            find .main-baseline/tests -path '*-snapshots/*.png' -type f | while read -r f; do
              rel="${f#.main-baseline/}"
              mkdir -p "$(dirname "$rel")"
              cp "$f" "$rel"
            done
          fi
          rm -rf .main-baseline

      - name: 🎭 Playwright
        shell: bash
        run: ${{ inputs.playwright-command }}${{ inputs.playwright-shards > 1 && format(' --shard={0}/{1}', matrix.shard, inputs.playwright-shards) || '' }}${{ inputs.playwright-github-report && ' --reporter=blob,list' || '' }}${{ inputs.playwright-snapshots && ' --update-snapshots' || '' }}

      - name: 📸 Lagre snapshots midlertidig
        if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' && !cancelled() }}
        shell: bash
        run: |
          find tests -path '*-snapshots/*.png' -type f > /tmp/snapshot-files.txt
          echo "Found $(wc -l < /tmp/snapshot-files.txt) snapshot files:"
          cat /tmp/snapshot-files.txt
          if [ -s /tmp/snapshot-files.txt ]; then
            tar cf /tmp/snapshots-${{ matrix.shard }}.tar -T /tmp/snapshot-files.txt
          fi

      - name: ⬆️ Last opp snapshot-endringer
        if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-changes-${{ matrix.shard }}
          path: /tmp/snapshots-${{ matrix.shard }}.tar
          if-no-files-found: ignore
          retention-days: 1

      - name: ⬆️ Last opp blob-report
        if: ${{ inputs.playwright-github-report && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  playwright-commit-snapshots:
    name: 📸 Commit Playwright-snapshots
    needs: [playwright-tests]
    if: ${{ inputs.playwright-snapshots && github.ref != 'refs/heads/main' && !cancelled() && needs.playwright-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔄 Hent kildekode
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: ⬇️ Last ned snapshot-endringer fra alle shards
        uses: actions/download-artifact@v4
        with:
          pattern: snapshot-changes-*
          path: /tmp/snapshot-artifacts
          merge-multiple: true

      - name: 📸 Gjenopprett snapshots
        shell: bash
        run: |
          shopt -s nullglob
          for f in /tmp/snapshot-artifacts/*.tar; do
            echo "Gjenoppretter $f"
            tar xf "$f"
          done
          find tests -path '*-snapshots/*.png' -type f | head -10 || true

      - name: 📸 Commit oppdaterte snapshots
        shell: bash
        run: |
          shopt -s globstar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/**/*-snapshots/**/*.png

          for file in $(git diff --cached --name-only -- '*.png'); do
            if git cat-file -e HEAD:"$file" 2>/dev/null; then
              git show HEAD:"$file" > /tmp/old_snapshot.png
              PIXELS=$(compare -metric AE /tmp/old_snapshot.png "$file" null: 2>&1 || true)
              if [ "$PIXELS" = "0" ]; then
                echo "Ingen visuell endring: $file"
                git checkout HEAD -- "$file"
              fi
            fi
          done

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "oppdater playwright snapshots"
            git push
          fi

  playwright-report:
    name: 📊 Playwright Report
    needs: [playwright-tests]
    if: ${{ contains(fromJSON('["refs/heads/main"]'), github.ref) && !cancelled() && inputs.playwright-github-report == true && needs.playwright-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v5

      - name: 📥 Sett opp pnpm
        uses: pnpm/action-setup@v6

      - name: 📦 Sett opp Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://npm.pkg.github.com'

      - name: 📥 Installer Avhengigheter
        uses: navikt/toi-frontend-workflows/.github/actions/install-pnpm-dependencies@v2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: ⬇️ Last ned blob-reports fra alle shards
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: 🔀 Slå sammen rapporter
        shell: bash
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy Playwright Report to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: playwright-report
          clean: false
          target-folder: playwright-report
          token: ${{ secrets.GITHUB_TOKEN }}

  a11y-tests:
    name: ♿ Pa11y
    needs: [build, test-build]
    if: ${{ !cancelled() && inputs.a11y-command != '' && needs.test-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🚀 Start testserver
        uses: navikt/toi-frontend-workflows/.github/actions/next-testserver@v2

      - name: ♿ Pa11y
        shell: bash
        run: ${{ inputs.a11y-command }}

  storybook:
    name: 📚 Storybook
    needs: [build, test-build]
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.storybook == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📚 Bygg og deploy Storybook
        uses: navikt/toi-frontend-workflows/.github/actions/build-storybook@v2
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        with:
          use-pnpm: true
          node-version: ${{ inputs.node-version }}
          storybook-base-path: ${{ inputs.storybook-base-path }}
          deploy-to-pages: ${{ contains(fromJSON('["refs/heads/main"]'), github.ref) }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-til-prod:
    name: 🚀 Deploy til produksjon
    needs:
      - build
      - playwright-tests
    if: ${{ always() && !inputs.deploy-to-dev-only && contains(fromJSON('["refs/heads/master", "refs/heads/main"]'), github.ref) && needs.build.result == 'success' && (inputs.playwright-command == '' || needs.playwright-tests.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Hent Kildekode
        uses: actions/checkout@v5

      - name: 📦 Deploy til Prod
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: ${{ inputs.prod-yaml-path }}${{ inputs.nais-alerts-path != '' && format(',{0}', inputs.nais-alerts-path) || '' }}
          VAR: image=${{ needs.build.outputs.image }}
          VARS: ${{ inputs.prod-vars-path }}

      - name: 📝 Deployment Oppsummering
        if: success()
        uses: navikt/toi-frontend-workflows/.github/actions/deployment-success-summary@v2
        with:
          image: ${{ needs.build.outputs.image }}
          branch: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          environment: Produksjon

      - name: ⚠️ Deployment Feilet
        if: failure()
        uses: navikt/toi-frontend-workflows/.github/actions/deployment-failure-summary@v2
        with:
          image: ${{ needs.build.outputs.image }}
          branch: ${{ github.ref_name }}
          environment: Produksjon

  lagre-digest:
    name: 💾 Base-image
    needs: [build, deploy-til-prod]
    # !cancelled() trengs: implisitt success() er usann når verifiser-digest er hoppet over
    if: ${{ !cancelled() && needs.deploy-til-prod.result == 'success' && needs.build.outputs.baseimage-digest != '' }}
    uses: navikt/toi-frontend-workflows/.github/workflows/lagre-digest.yaml@v3.1
    with:
      digest: ${{ needs.build.outputs.baseimage-digest }}
